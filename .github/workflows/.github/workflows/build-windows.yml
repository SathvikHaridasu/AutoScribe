# .github/workflows/build-windows.yml
name: build-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyautogui keyboard
          pip install -r requirements.txt
        shell: cmd
      
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name AutoScribe --icon=assets/icon.ico autoscribe.py
        shell: cmd
      
      - name: Create Installer
        run: |
          # Determine version from tag or use build number
          if ("${{ github.ref_type }}" -eq "tag") {
            $VERSION = "${{ github.ref_name }}"
          } else {
            $VERSION = "ci-${{ github.run_number }}"
          }
          
          # Download NSIS
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/nsis/files/NSIS%203/3.08/nsis-3.08-setup.exe/download" -OutFile "nsis-setup.exe"
          Start-Process -FilePath "nsis-setup.exe" -ArgumentList "/S" -Wait
          
          # Create installer script
          $NSIS_SCRIPT = @"
          !include "MUI2.nsh"
          Name "AutoScribe"
          OutFile "AutoScribe-$VERSION-Setup.exe"
          InstallDir "`$PROGRAMFILES\AutoScribe"
          
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          
          !insertmacro MUI_LANGUAGE "English"
          
          Section "Install"
            SetOutPath "`$INSTDIR"
            File "dist\AutoScribe.exe"
            
            # Create Start Menu shortcuts
            CreateDirectory "`$SMPROGRAMS\AutoScribe"
            CreateShortcut "`$SMPROGRAMS\AutoScribe\AutoScribe.lnk" "`$INSTDIR\AutoScribe.exe"
            CreateShortcut "`$SMPROGRAMS\AutoScribe\Uninstall.lnk" "`$INSTDIR\Uninstall.exe"
            
            # Create Desktop shortcut
            CreateShortcut "`$DESKTOP\AutoScribe.lnk" "`$INSTDIR\AutoScribe.exe"
            
            # Create uninstaller
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
          SectionEnd
          
          Section "Uninstall"
            Delete "`$INSTDIR\AutoScribe.exe"
            Delete "`$INSTDIR\Uninstall.exe"
            RMDir "`$INSTDIR"
            
            Delete "`$SMPROGRAMS\AutoScribe\AutoScribe.lnk"
            Delete "`$SMPROGRAMS\AutoScribe\Uninstall.lnk"
            RMDir "`$SMPROGRAMS\AutoScribe"
            
            Delete "`$DESKTOP\AutoScribe.lnk"
          SectionEnd
          "@
          
          Set-Content -Path "installer.nsi" -Value $NSIS_SCRIPT
          
          # Build installer
          & 'C:\Program Files (x86)\NSIS\makensis.exe' installer.nsi
          
          # Show output file
          ls AutoScribe-$VERSION-Setup.exe
        shell: pwsh
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: AutoScribe-*.exe
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Artifact (for testing)
        uses: actions/upload-artifact@v3
        with:
          name: windows-installer
          path: AutoScribe-*.exe