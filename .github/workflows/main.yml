name: build-macos

on:
  push:
    tags:
      - 'v*'          # runs when you push a tag like v1.0.0
  workflow_dispatch: {}  # lets you run it manually from the Actions tab

jobs:
  macos:
    # macos-13 = Intel (x86_64). For Apple Silicon build, see "Optional: arm64" below.
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .app with PyInstaller
        run: |
          # Adjust --add-data lines if you have any non-Python files to include.
          # macOS uses "src:dest" for --add-data
          pyinstaller --onedir --windowed --name "AutoScribe" \
            autoscribe.py
          # Example if you need to include files:
          # pyinstaller --onedir --windowed --name "AutoScribe" \
          #   --add-data "config.json:." --add-data "assets:assets" \
          #   autoscribe.py

      - name: Create DMG (simple, using hdiutil)
        run: |
          mkdir -p package
          cp -R "dist/AutoScribe.app" package/
          ln -s /Applications package/Applications
          hdiutil create -volname "AutoScribe" -srcfolder package -ov -format UDZO "AutoScribe-${{ github.ref_name }}.dmg"

      - name: Upload artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: AutoScribe-mac-${{ github.ref_name }}
          path: AutoScribe-${{ github.ref_name }}.dmg

      - name: Create GitHub Release and upload DMG (for tagged builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoScribe-${{ github.ref_name }}.dmg
